name: Sync Intervals.icu Data

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Download and Sort CSV from Intervals.icu
        env:
          API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
        run: |
          # 1. 원본 CSV 다운로드 (URL의 & 기호 이스케이프)
          curl -s -u "API_KEY:${API_KEY}" "https://intervals.icu/api/v1/athlete/${ATHLETE_ID}/activities.csv?oldest=2025-01-01\&newest=2026-12-31" -o raw.csv
          
          # 2. 헤더는 남기고, 데이터 부분만 2행(start_date_local) 기준 역순(최신순) 정렬
          head -n 1 raw.csv > intervals_training_log.csv
          tail -n +2 raw.csv | sort -t',' -k2 -r >> intervals_training_log.csv

      - name: Commit and push updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add intervals_training_log.csv
          git commit -m "Auto update training log with latest sorting" || exit 0
          git push --force
