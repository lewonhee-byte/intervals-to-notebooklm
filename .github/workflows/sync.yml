name: Sync Intervals.icu Data

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Download and Sort CSV from Intervals.icu
        env:
          API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
        run: |
          set -e

          OLDEST="2025-01-01"
          NEWEST=$(date -u +%Y-%m-%d)

          echo "Downloading Intervals.icu data..."
          echo "Date range: ${OLDEST} to ${NEWEST}"

          curl -f -sS \
            -u "API_KEY:${API_KEY}" \
            "https://intervals.icu/api/v1/athlete/${ATHLETE_ID}/activities.csv?oldest=${OLDEST}&newest=${NEWEST}" \
            -o raw.csv

          echo "Download successful."

          if [ ! -s raw.csv ]; then
            echo "ERROR: raw.csv is empty."
            exit 1
          fi

          echo "CSV header:"
          head -n 1 raw.csv

          # 헤더 보존
          head -n 1 raw.csv > intervals_training_log.csv

          # 데이터만 날짜 기준 역순 정렬
          tail -n +2 raw.csv | sort -r -t',' -k2,2 >> intervals_training_log.csv

          echo "CSV created successfully."
          echo "Number of records:"
          tail -n +2 intervals_training_log.csv | wc -l

      - name: Commit and push updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add intervals_training_log.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto update training log"
          git push
