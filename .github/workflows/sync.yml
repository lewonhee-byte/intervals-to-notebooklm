name: Sync Intervals.icu Data

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Download and Sort CSV from Intervals.icu
        env:
          API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
        run: |
          # 1. 2025-01-01부터 오늘까지의 날짜 설정
          OLDEST="2025-01-01"
          NEWEST=$(date +%Y-%m-%d)
          
          # 2. Intervals.icu에서 원본 CSV 다운로드
          curl -s -u "API_KEY:${API_KEY}" "https://intervals.icu/api/v1/athlete/${ATHLETE_ID}/activities.csv?oldest=${OLDEST}&newest=${NEWEST}" -o raw.csv
          
          # 3. 최신 날짜(2026년)가 맨 위로 오도록 내림차순 정렬하여 저장
          python3 -c "
          import pandas as pd
          try:
              df = pd.read_csv('raw.csv')
              if 'start_date_local' in df.columns:
                  df = df.sort_values(by='start_date_local', ascending=False)
              df.to_csv('intervals_training_log.csv', index=False)
              print('Successfully sorted and saved CSV.')
          except Exception as e:
              print(f'Error sorting CSV: {e}')
              import shutil
              shutil.copy('raw.csv', 'intervals_training_log.csv')
          "

      - name: Commit and push updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add intervals_training_log.csv
          git commit -m "Auto update training log with latest sorting" || exit 0
          git push --force
